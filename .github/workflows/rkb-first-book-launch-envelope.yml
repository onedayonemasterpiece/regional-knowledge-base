name: rkb-first-book-launch-envelope

on:
  pull_request:
    paths:
      - 'src/regional_knowledge/**'
      - 'scripts/production/bge_kaggle_worker.py'
      - 'sql/kaggle/**'
      - 'tests/test_import_actual_launch_metadata_shkiper.py'
      - 'tests/fixtures/import-native-metadata/**'
      - '.github/workflows/rkb-first-book-launch-envelope.yml'
  push:
    branches: [chatgpt/rkb-first-book-launch-envelope-20261022]

permissions:
  contents: read
  actions: read

jobs:
  actual-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src:tests
      RKB_IMPORT_NATIVE_METADATA: metadata-proof/dependency-proof
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev,ingest,kaggle]'
      - name: Restore exact preserved native metadata
        run: |
          mkdir -p metadata-proof/dependency-proof
          gzip -dc tests/fixtures/import-native-metadata/native-manifest.json.gz > metadata-proof/dependency-proof/native-manifest.json
          cp tests/fixtures/import-native-metadata/native-receipt.json metadata-proof/dependency-proof/
      - run: python -m pytest tests/test_import_actual_launch_metadata_shkiper.py -q -s --junitxml=first-book-envelope.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-book-launch-envelope
          path: first-book-envelope.xml
          retention-days: 14
