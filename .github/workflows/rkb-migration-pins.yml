name: rkb-migration-pins

on:
  push:
    branches: [chatgpt/rkb-migration-pins-20261022]
  pull_request:
    paths:
      - .github/workflows/rkb-migration-pins.yml
      - scripts/production/generate_migration_pins.py

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_PASSWORD: graph_fixture_only
          POSTGRES_DB: rkb_graph_test
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d rkb_graph_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: src
      RKB_KAGGLE_TEST_DSN: postgresql://postgres:graph_fixture_only@127.0.0.1:54329/rkb_graph_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev,kaggle]'
      - run: python scripts/production/generate_migration_pins.py migration-function-pins.json
      - uses: actions/upload-artifact@v4
        with:
          name: rkb-migration-function-pins
          path: migration-function-pins.json
          if-no-files-found: error
          retention-days: 14
