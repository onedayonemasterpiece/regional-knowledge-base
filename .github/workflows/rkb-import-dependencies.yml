name: rkb-import-dependencies

on:
  push:
    branches: [chatgpt/rkb-import-dependencies-20261022]
    paths:
      - scripts/production/prepare_import_dependencies.py
      - scripts/production/manifests/kaggle-native-noble-pg17.11-base-lock.json
      - scripts/production/manifests/kaggle-native-djvu-noble-lock-20261022.json
      - scripts/production/manifests/native-preserved-*-Packages
      - scripts/production/manifests/native-preserved-metadata-20261022.json
      - scripts/production/manifests/telethon-stage0-input-20261022.json
      - tests/test_import_dependency_packaging.py
      - .github/workflows/rkb-import-dependencies.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Reuse reviewed existing DjVu ELF validator
        uses: actions/checkout@v4
        with:
          ref: 622e5b8e591f6ecf36404078eb41fb659b9e2cae
          path: .ci-djvu-contract
          persist-credentials: false
          sparse-checkout: src/regional_knowledge/kaggle_djvu_elf.py
          sparse-checkout-cone-mode: false
      - name: Pin exact validator bytes in disposable CI source overlay
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          raw = Path('.ci-djvu-contract/src/regional_knowledge/kaggle_djvu_elf.py').read_bytes()
          assert hashlib.sha256(raw).hexdigest() == '904b782aabd7af8a798c608655ed4671d60249ffc370ba0501d80081b2db96b9'
          Path('src/regional_knowledge/kaggle_djvu_elf.py').write_bytes(raw)
          PY
      - name: Install only focused test tooling on GitHub runner
        run: python -m pip install 'pytest==8.4.2'
      - name: Verify changed packaging boundaries
        run: python -m pytest tests/test_import_dependency_packaging.py -q --junitxml=packaging-tests.xml
      - name: Capture and assemble full import native dependencies
        run: python scripts/production/prepare_import_dependencies.py --output dependency-proof
      - name: Retain exact dependency bytes and unresolved inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rkb-import-dependencies
          path: |
            dependency-proof/native-package-lock.json
            dependency-proof/native-base-lock.json
            dependency-proof/native-merge-review.json
            dependency-proof/djvu-package-lock.json
            dependency-proof/metadata-receipts.json
            dependency-proof/native-bound.json
            dependency-proof/native-receipt.json
            dependency-proof/native-manifest.json
            dependency-proof/native-packages.tar
            dependency-proof/ddjvu-elf-closure.json
            dependency-proof/stage0-wheel-lock.json
            packaging-tests.xml
          retention-days: 14
