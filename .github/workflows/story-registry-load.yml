name: Story Registry synthetic load
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/regional_knowledge/story_registry.py'
      - 'src/regional_knowledge/story_contracts.py'
      - 'scripts/benchmarks/story_registry_synthetic.py'
      - '.github/workflows/story-registry-load.yml'

jobs:
  sqlite-story-load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project
        run: python -m pip install -e .
      - name: 10k stories, 10 readers, 3 writers
        run: python scripts/benchmarks/story_registry_synthetic.py
